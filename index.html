<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTS to MP4</title>
<style>
:root{--bg:#f7f8f6;--fg:#17211b;--muted:#6b766f;--line:#dfe4df;--accent:#1f4d3a;--accent-fg:#fff;--err:#a3321f;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--fg:#e8eee9;--muted:#8d9a92;--line:#26302a;--accent:#4f9c78;--accent-fg:#0b1510;--err:#e0806d;--card:#161d19}}
:root[data-theme="dark"]{--bg:#101512;--fg:#e8eee9;--muted:#8d9a92;--line:#26302a;--accent:#4f9c78;--accent-fg:#0b1510;--err:#e0806d;--card:#161d19}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 32px;max-width:44ch}
.drop{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;background:var(--card);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent)}
.drop p{margin:0 0 16px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;padding:12px 20px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:28px 0 0;padding:0}
li{padding:14px 0;border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.name{overflow-wrap:anywhere;font-weight:500}
.st{color:var(--muted);font-size:14px;white-space:nowrap}
.st.done{color:var(--accent);font-weight:600}
.st.error{color:var(--err)}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
li.busy .bar{display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.actions button.primary{flex:1 1 200px}
.msg{margin-top:16px;color:var(--muted);font-size:14px;min-height:21px}
.foot{margin-top:40px;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>MTS to MP4</h1>
  <p class="sub">Convert camcorder videos in your browser. Video quality is kept as is, and nothing is uploaded.</p>

  <label class="drop" id="drop">
    <p>Choose one or more .MTS files</p>
    <input id="pick" type="file" multiple accept=".mts,.MTS,.m2ts" hidden>
    <button type="button" class="primary" id="chooseBtn">Choose videos</button>
  </label>

  <ul id="list"></ul>

  <div class="actions" id="actions" hidden>
    <button class="primary" id="convertBtn">Convert</button>
    <button id="dlBtn" class="primary" hidden>Download all (.zip)</button>
    <button id="clearBtn">Clear</button>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <p class="foot">Video is copied without re-encoding. Audio is converted to 256 kbps AAC so the MP4 plays everywhere. The converter (about 30 MB) downloads the first time you convert.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
const $=id=>document.getElementById(id);
const pick=$('pick'),list=$('list'),msg=$('msg'),actions=$('actions'),convertBtn=$('convertBtn'),dlBtn=$('dlBtn'),clearBtn=$('clearBtn'),drop=$('drop');
let items=[],ff=null,busy=false,current=null;

$('chooseBtn').onclick=e=>{e.preventDefault();pick.click()};
pick.onchange=()=>{add(pick.files);pick.value=''};
['dragover','dragenter'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>add(e.dataTransfer.files));

const fmt=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB';
const outName=n=>n.replace(/\.[^.]*$/,'')+'.mp4';

function add(files){
  if(busy)return;
  for(const f of files){
    if(!/\.(mts|m2ts)$/i.test(f.name))continue;
    const li=document.createElement('li');
    li.innerHTML='<div class="row"><span class="name"></span><span class="st"></span></div><div class="bar"><i></i></div>';
    li.querySelector('.name').textContent=f.name+' ('+fmt(f.size)+')';
    list.appendChild(li);
    items.push({file:f,li,st:li.querySelector('.st'),bar:li.querySelector('i'),data:null});
    setSt(items[items.length-1],'Waiting');
  }
  refresh();
}
function setSt(it,t,cls){it.st.textContent=t;it.st.className='st '+(cls||'')}
function refresh(){
  actions.hidden=!items.length;
  const pending=items.some(i=>!i.data&&i.st.className.indexOf('error')<0);
  convertBtn.hidden=!pending;
  convertBtn.disabled=busy;
  clearBtn.disabled=busy;
  const done=items.filter(i=>i.data).length;
  dlBtn.hidden=!done;
  dlBtn.textContent=done===1?'Download video':'Download all (.zip)';
}
clearBtn.onclick=()=>{items=[];list.innerHTML='';msg.textContent='';refresh()};

async function load(){
  if(ff)return;
  if(typeof FFmpegWASM==='undefined'||typeof FFmpegUtil==='undefined')
    throw new Error('The converter scripts did not load (blocked or offline).');
  const {FFmpeg}=FFmpegWASM,{toBlobURL}=FFmpegUtil;
  const hosts=['https://cdn.jsdelivr.net/npm','https://unpkg.com'];
  let lastErr;
  for(const h of hosts){
    try{
      const base=h+'/@ffmpeg/core@0.12.6/dist/esm';
      const wbase=h+'/@ffmpeg/ffmpeg@0.12.10/dist/umd';
      const f=new FFmpeg();
      f.on('progress',({progress})=>{
        if(current&&progress>=0){
          const p=Math.min(100,Math.round(progress*100));
          current.bar.style.width=p+'%';setSt(current,'Converting '+p+'%');
        }
      });
      await f.load({
        coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),
        wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm'),
        classWorkerURL:await toBlobURL(wbase+'/814.ffmpeg.js','text/javascript')
      });
      ff=f;return;
    }catch(e){lastErr=e;console.error('Load failed from '+h,e)}
  }
  throw lastErr;
}

convertBtn.onclick=async()=>{
  busy=true;refresh();
  try{
    msg.textContent='Preparing converter…';
    await load();
    msg.textContent='';
  }catch(e){
    msg.textContent='The converter could not load: '+((e&&e.message)||e)+' Check your connection and try again.';
    busy=false;refresh();return;
  }
  for(const it of items){
    if(it.data||it.st.className.indexOf('error')>=0)continue;
    current=it;it.li.classList.add('busy');it.bar.style.width='0%';setSt(it,'Converting 0%');
    try{
      await ff.writeFile('in.mts',new Uint8Array(await it.file.arrayBuffer()));
      const code=await ff.exec(['-i','in.mts','-map','0:v:0','-map','0:a:0?','-c:v','copy','-c:a','aac','-b:a','256k','-movflags','+faststart','out.mp4']);
      if(code!==0)throw new Error('The file could not be read as video.');
      it.data=await ff.readFile('out.mp4');
      it.bar.style.width='100%';
      setSt(it,'Done · '+fmt(it.data.length),'done');
    }catch(e){
      setSt(it,'Failed. The file may be too large or damaged.','error');
    }
    try{await ff.deleteFile('in.mts')}catch(_){}
    try{await ff.deleteFile('out.mp4')}catch(_){}
    it.li.classList.remove('busy');
  }
  current=null;busy=false;refresh();
  const n=items.filter(i=>i.data).length;
  msg.textContent=n?n+' of '+items.length+' converted. Tap the download button to save '+(n===1?'it':'them')+'.':'';
};

dlBtn.onclick=()=>{
  const used=new Set(),out=[];
  for(const it of items){
    if(!it.data)continue;
    let n=outName(it.file.name),k=1;
    while(used.has(n.toLowerCase()))n=outName(it.file.name).replace(/\.mp4$/,' ('+(k++)+').mp4');
    used.add(n.toLowerCase());out.push({name:n,data:it.data});
  }
  const single=out.length===1;
  const blob=single?new Blob([out[0].data],{type:'video/mp4'}):zip(out);
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=single?out[0].name:'converted-videos.zip';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
};

/* Minimal store-only ZIP writer (MP4 is already compressed) */
const T=new Uint32Array(256);
for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
function crc(b){let c=-1;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return (c^-1)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const d=new Date(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const n=enc.encode(f.name),c=crc(f.data),s=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);
    h.setUint16(10,time,true);h.setUint16(12,date,true);h.setUint32(14,c,true);
    h.setUint32(18,s,true);h.setUint32(22,s,true);h.setUint16(26,n.length,true);
    parts.push(h.buffer,n,f.data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);
    e.setUint16(12,time,true);e.setUint16(14,date,true);e.setUint32(16,c,true);
    e.setUint32(20,s,true);e.setUint32(24,s,true);e.setUint16(28,n.length,true);e.setUint32(42,off,true);
    cd.push(e.buffer,n);
    off+=30+n.length+s;
  }
  let cs=0;for(const p of cd)cs+=p.byteLength;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:'application/zip'});
}
</script>
</body>
</html>
